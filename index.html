<!doctype html>
<html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vanat Katha | Interest Manager</title>
<style>
:root{--navy:#10243a;--blue:#2459a9;--teal:#168477;--bg:#f3f6fb;--ink:#17283d;--muted:#68788e;--line:#e0e7f0;--red:#b33a45;--gold:#a96b0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans Gujarati",Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:var(--navy);color:white;padding:22px 14px}.brand{font-size:20px;font-weight:800;letter-spacing:.3px;padding:5px 10px 4px}.subbrand{color:#aebed0;font-size:12px;padding:0 10px 25px}.nav{display:flex;flex-direction:column;gap:6px}.nav button{border:0;text-align:left;background:transparent;color:#d7e2ee;padding:12px;border-radius:10px;font-size:14px}.nav button.active,.nav button:hover{background:#27415e;color:#fff}.note{font-size:11px;color:#aebed0;line-height:1.6;margin:25px 10px}.main{min-width:0}.top{background:white;border-bottom:1px solid var(--line);padding:17px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px}.top h1{margin:0;font-size:21px}.top small{color:var(--muted)}.badge{background:#e9f6f3;color:#147265;padding:7px 11px;border-radius:20px;font-size:12px;font-weight:700}.content{padding:24px;max-width:1500px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 8px #1a355208}.metric .label{font-size:12px;color:var(--muted)}.metric .value{font-size:25px;font-weight:800;margin-top:9px}.metric .hint{font-size:11px;color:var(--muted);margin-top:6px}.panel{margin-top:18px}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.panel h2{font-size:16px;margin:0}.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:#51627a;font-weight:700}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;border:1px solid #d7e0eb;border-radius:8px;padding:10px;background:#fff;color:var(--ink);min-width:0}.field textarea{min-height:70px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;font-size:13px}.primary{background:var(--blue);color:white}.secondary{background:#eaf0f8;color:#24405f}.success{background:var(--teal);color:white}.danger{background:#fff0f1;color:var(--red)}.warning{background:#fff4dd;color:#88590b}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{width:auto;flex:1;min-width:150px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:700px;font-size:12px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#f7f9fc;color:#5b6b80;font-size:11px;white-space:nowrap}tr:last-child td{border-bottom:0}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#edf2f8;color:#425873;font-size:10px;font-weight:700}.pill.green{background:#e6f7f0;color:#16745d}.pill.red{background:#fff0f1;color:#a12c3c}.pill.gold{background:#fff3d9;color:#8a5a06}.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}.hidden{display:none!important}.muted{color:var(--muted);font-size:12px;line-height:1.6}.sectiontitle{margin:0 0 14px;font-size:19px}.callout{padding:12px 14px;border-radius:9px;background:#eef5ff;color:#2e527e;font-size:12px;line-height:1.7;margin-bottom:14px}.totals{display:flex;gap:10px;flex-wrap:wrap}.totalchip{background:#f5f8fc;border:1px solid var(--line);padding:8px 12px;border-radius:9px;font-size:12px}.mobile-menu{display:none}.toast{position:fixed;bottom:18px;right:18px;background:#13283e;color:#fff;padding:12px 17px;border-radius:9px;box-shadow:0 6px 25px #0002;z-index:9;font-size:13px}.smallbtn{border:0;border-radius:6px;padding:6px 8px;font-size:11px;margin:2px}.footerhint{margin-top:18px;font-size:11px;color:var(--muted)}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{padding:12px;position:sticky;top:0;z-index:5}.brand{font-size:17px}.subbrand,.note{display:none}.nav{flex-direction:row;overflow:auto;padding-top:10px}.nav button{white-space:nowrap;padding:9px 10px;font-size:12px}.content{padding:14px}.top{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.row{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:8px}.metric{padding:12px}.metric .value{font-size:19px}.row{grid-template-columns:1fr}.top h1{font-size:17px}.badge{font-size:10px}.content{padding:10px}.panel{padding:13px}.nav button{font-size:11px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">VANAT KATHA</div><div class="subbrand">Interest & Outstanding Manager</div><nav class="nav" id="nav"><button class="active" data-page="dashboard">▦ Dashboard</button><button data-page="parties">♙ Party & Broker</button><button data-page="bills">▤ Bill Entry</button><button data-page="collection">₹ Interest Collection</button><button data-page="waivers">✓ Waiver / Approval</button><button data-page="reports">▥ Reports</button><button data-page="backup">⚙ Backup & Settings</button></nav><div class="note">Prototype version<br>મોબાઇલ અને કમ્પ્યુટર બંને માટે<br><br>ડેટા આ બ્રાઉઝરમાં સેવ થાય છે.</div></aside><main class="main"><header class="top"><div><h1 id="pageTitle">Dashboard</h1><small id="today"></small></div><span class="badge">● Local Demo</span></header><div class="content" id="app"></div></main></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(n)||0), today=()=>new Date().toISOString().slice(0,10), uid=()=>Math.random().toString(36).slice(2,9).toUpperCase();
let db=JSON.parse(localStorage.getItem('vanatKathaDB')||'{"parties":[],"bills":[],"receipts":[],"waivers":[]}');let page='dashboard';$('#today').textContent=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
function save(){localStorage.setItem('vanatKathaDB',JSON.stringify(db));render()}function toast(t){let e=$('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2600)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function party(id){return db.parties.find(p=>p.id===id)}function bill(id){return db.bills.find(b=>b.id===id)}function fmtDate(s){return s?new Date(s+'T12:00:00').toLocaleDateString('en-IN'):'—'}
function interest(b,asof=today()){let start=new Date(b.date+'T12:00:00');start.setDate(start.getDate()+Number(b.freeDays||90)+1);let end=new Date(asof+'T12:00:00');if(end<start)return 0;let days=Math.floor((end-start)/86400000)+1;let base=b.base==='gross'?Number(b.total):Number(b.net);let principal=Math.max(0,base-Number(b.principalPaid||0));let gross=principal*Number(b.rate||18)/100*days/365;let received=db.receipts.filter(r=>r.billId===b.id).reduce((s,r)=>s+Number(r.amount||0),0);let waived=db.waivers.filter(w=>w.billId===b.id&&w.status==='approved').reduce((s,w)=>s+Number(w.amount||0),0);return Math.max(0,gross-received-waived)}function totalAccrued(b,asof=today()){let start=new Date(b.date+'T12:00:00');start.setDate(start.getDate()+Number(b.freeDays||90)+1);let end=new Date(asof+'T12:00:00');if(end<start)return 0;let days=Math.floor((end-start)/86400000)+1;let base=b.base==='gross'?Number(b.total):Number(b.net);let principal=Math.max(0,base-Number(b.principalPaid||0));return principal*Number(b.rate||18)/100*days/365}function sum(a,f){return a.reduce((s,x)=>s+f(x),0)}function outstanding(b){return interest(b)}function received(bid){return sum(db.receipts.filter(r=>r.billId===bid),r=>Number(r.amount))}function waived(bid){return sum(db.waivers.filter(w=>w.billId===bid&&w.status==='approved'),w=>Number(w.amount))}function btn(label,cls,act){return `<button class="btn ${cls}" onclick="${act}">${label}</button>`}function field(label,name,type='text',required=false,value='',extra=''){return `<div class="field"><label>${label}${required?' *':''}</label><input name="${name}" type="${type}" ${required?'required':''} value="${esc(value)}" ${extra}></div>`}function select(label,name,opts,required=true){return `<div class="field"><label>${label}${required?' *':''}</label><select name="${name}" ${required?'required':''}>${opts.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select></div>`}function formStart(id){return `<form id="${id}">`}function navPage(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)navPage(b.dataset.page)});
function render(){let titles={dashboard:'Dashboard',parties:'Party & Broker Master',bills:'Bill Entry & Interest Calculation',collection:'Interest Collection',waivers:'Waiver & Approval',reports:'Reports',backup:'Backup & Settings'};$('#pageTitle').textContent=titles[page];let app=$('#app');({dashboard:dash,parties:partiesPage,bills:billsPage,collection:collectionPage,waivers:waiversPage,reports:reportsPage,backup:backupPage}[page]||dash)(app)}
function dash(el){let out=sum(db.bills,outstanding),rec=sum(db.receipts,r=>Number(r.amount)),pending=db.waivers.filter(w=>w.status==='pending'),gross=sum(db.bills,b=>Number(b.total));el.innerHTML=`<div class="grid"><div class="card metric"><div class="label">કુલ બિલ (GST સહિત)</div><div class="value">${money(gross)}</div><div class="hint">${db.bills.length} બિલ</div></div><div class="card metric"><div class="label">બાકી વ્યાજ</div><div class="value">${money(out)}</div><div class="hint">હાલની તારીખ સુધી અંદાજિત</div></div><div class="card metric"><div class="label">કુલ વ્યાજ વસૂલાત</div><div class="value">${money(rec)}</div><div class="hint">${db.receipts.length} રિસીવિંગ એન્ટ્રી</div></div><div class="card metric"><div class="label">Approval Pending</div><div class="value">${pending.length}</div><div class="hint">₹500થી વધુની માફી</div></div></div><section class="panel"><div class="panelhead"><h2>ઝડપી કામ</h2></div><div class="actions">${btn('+ Party ઉમેરો','primary',"navPage('parties')")}${btn('+ Bill દાખલ કરો','secondary',"navPage('bills')")}${btn('Interest Collection','success',"navPage('collection')")}${btn('Approval જુઓ','warning',"navPage('waivers')")}</div></section><section class="panel"><div class="panelhead"><h2>હાલનું Interest Outstanding</h2>${btn('બધા રિપોર્ટ','secondary',"navPage('reports')")}</div>${billTable(db.bills.filter(b=>outstanding(b)>0).slice(0,8))}</section><div class="callout" style="margin-top:16px">⚠️ આ પ્રારંભિક ડેમો છે. ડેટા હાલ આ બ્રાઉઝરમાં જ સેવ થાય છે. વાસ્તવિક ટીમ-ઉપયોગ માટે સુરક્ષિત સર્વર, લૉગિન, ક્લાઉડ ડેટાબેઝ અને બેકઅપ જોડવાના રહેશે. વ્યાજની ગણતરી કરાર મુજબ ચકાસવી.</div>`}
function partiesPage(el){el.innerHTML=`<h2 class="sectiontitle">પાર્ટી અને બ્રોકર ઉમેરો</h2><div class="panel"><div class="callout">પાર્ટીનું નામ, સરનામું, મોબાઇલ અને બ્રોકરનું નામ ફરજિયાત છે. GST નંબર અને બ્રોકરનો મોબાઇલ વૈકલ્પિક છે.</div>${formStart('partyForm')}<div class="row">${field('પાર્ટીનું નામ','name','text',true)}${field('સરનામું','address','text',true)}${field('પાર્ટી મોબાઇલ નંબર','mobile','tel',true,'','pattern="[0-9+() -]{8,18}"')}${field('GST નંબર (વૈકલ્પિક)','gst','text',false)}${field('બ્રોકરનું નામ','broker','text',true)}${field('બ્રોકર મોબાઇલ (વૈકલ્પિક)','brokerMobile','tel',false)}${field('વાર્ષિક વ્યાજ દર (%)','rate','number',true,'18','step="0.01" min="0"')}${field('વ્યાજમુક્ત દિવસો','freeDays','number',true,'90','min="0"')}${select('વ્યાજ ગણતરીનો આધાર','base',[['net','GST વગરની રકમ'],['gross','GST સહિતની કુલ રકમ']])}</div><div class="actions"><button class="btn primary" type="submit">પાર્ટી સેવ કરો</button><button class="btn secondary" type="reset">Clear</button></div></form></div><section class="panel"><div class="panelhead"><h2>પાર્ટી લિસ્ટ (${db.parties.length})</h2></div><div class="toolbar"><input id="partySearch" placeholder="પાર્ટી / બ્રોકર / મોબાઇલ શોધો" oninput="filterTable('partySearch','partyRows')"></div><div class="tablewrap"><table><thead><tr><th>પાર્ટી</th><th>મોબાઇલ</th><th>GST નંબર</th><th>બ્રોકર</th><th>વ્યાજ આધાર</th><th>વ્યાજ દર</th><th>ક્રિયા</th></tr></thead><tbody id="partyRows">${db.parties.map(p=>`<tr data-search="${esc((p.name+' '+p.broker+' '+p.mobile).toLowerCase())}"><td><b>${esc(p.name)}</b><br><span class="muted">${esc(p.address)}</span></td><td>${esc(p.mobile)}</td><td>${esc(p.gst||'—')}</td><td>${esc(p.broker)}<br><span class="muted">${esc(p.brokerMobile||'')}</span></td><td>${p.base==='gross'?'GST સહિત':'GST વગર'}</td><td>${p.rate}% / ${p.freeDays} દિવસ ફ્રી</td><td><button class="smallbtn danger" onclick="deleteParty('${p.id}')">Delete</button></td></tr>`).join('')||`<tr><td colspan="7" class="empty">હજુ કોઈ પાર્ટી નથી.</td></tr>`}</tbody></table></div></section>`;$('#partyForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(db.parties.some(p=>p.name.toLowerCase()===d.name.toLowerCase()))return toast('આ નામની પાર્ટી પહેલેથી છે.');db.parties.push({...d,id:uid(),rate:Number(d.rate),freeDays:Number(d.freeDays)});save();toast('પાર્ટી સેવ થઈ ગઈ.')}}
function deleteParty(id){if(db.bills.some(b=>b.partyId===id))return toast('આ પાર્ટીના બિલ છે, એટલે ડિલીટ નહીં કરી શકાય.');if(confirm('આ પાર્ટી ડિલીટ કરવી છે?')){db.parties=db.parties.filter(p=>p.id!==id);save()}}function filterTable(input,tbody){let q=$('#'+input).value.toLowerCase();document.querySelectorAll('#'+tbody+' tr').forEach(r=>r.style.display=(r.dataset.search||'').includes(q)?'':'none')}
function billsPage(el){el.innerHTML=`<h2 class="sectiontitle">નવું બિલ દાખલ કરો</h2><div class="panel"><div class="callout">GST ડિફોલ્ટ 5% છે. મૂળ રકમ બદલતાં GST અને કુલ રકમ આપમેળે ગણાશે. જો જરૂર હોય તો GST રકમ મેન્યુઅલી સુધારી શકો છો.</div>${db.parties.length?formStart('billForm')+`<div class="row">${select('પાર્ટીનું નામ','partyId',db.parties.map(p=>[p.id,p.name]))}${field('બિલ નંબર','number','text',true)}${field('બિલ તારીખ','date','date',true,today())}${field('GST વગરની બિલ રકમ','net','number',true,'','step="0.01" min="0"')}${field('GST દર (%)','gstRate','number',true,'5','step="0.01" min="0"')}${field('GST રકમ (સુધારી શકાય)','gstAmount','number',true,'0','step="0.01" min="0"')}${field('કુલ બિલ રકમ','total','number',true,'0','step="0.01" min="0"')}${field('વ્યાજમુક્ત દિવસો','freeDays','number',true,'90','min="0"')}${field('વાર્ષિક વ્યાજ દર (%)','rate','number',true,'18','step="0.01" min="0"')}${select('વ્યાજ ગણતરીનો આધાર','base',[['party','પાર્ટીના સેટિંગ પ્રમાણે'],['net','GST વગર'],['gross','GST સહિત']])}${field('બિલ પેમેન્ટ મળવાની તારીખ (વૈકલ્પિક)','paidDate','date',false)}${field('મૂળ રકમની વસૂલાત (જો થઈ હોય)','principalPaid','number',false,'0','step="0.01" min="0"')}</div><div class="actions"><button class="btn primary" type="submit">બિલ સેવ કરો</button><button class="btn secondary" type="reset">Clear</button></div></form>`:`<div class="empty">પહેલાં Party & Broker વિભાગમાં પાર્ટી બનાવો.</div>`}</div><section class="panel"><div class="panelhead"><h2>બિલ લિસ્ટ (${db.bills.length})</h2></div><div class="toolbar"><input id="billSearch" placeholder="પાર્ટી અથવા બિલ નંબર શોધો" oninput="filterTable('billSearch','billRows')"></div><div id="billRows">${billTable(db.bills)}</div></section>`;let f=$('#billForm');if(f){let net=f.elements.net,gst=f.elements.gstRate,ga=f.elements.gstAmount,total=f.elements.total,partySel=f.elements.partyId;function calc(){let n=Number(net.value)||0,r=Number(gst.value)||0;ga.value=(n*r/100).toFixed(2);total.value=(n+Number(ga.value)).toFixed(2)}net.addEventListener('input',calc);gst.addEventListener('input',calc);ga.addEventListener('input',()=>total.value=((Number(net.value)||0)+(Number(ga.value)||0)).toFixed(2));partySel.addEventListener('change',()=>{let p=party(partySel.value);if(p){f.elements.rate.value=p.rate;f.elements.freeDays.value=p.freeDays;f.elements.base.value='party'}});f.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));if(db.bills.some(b=>b.partyId===d.partyId&&b.number===d.number))return toast('આ પાર્ટી માટે આ બિલ નંબર પહેલેથી છે.');let p=party(d.partyId);let base=d.base==='party'?p.base:d.base;db.bills.push({...d,id:uid(),rate:Number(d.rate),freeDays:Number(d.freeDays),net:Number(d.net),gstRate:Number(d.gstRate),gstAmount:Number(d.gstAmount),total:Number(d.total),principalPaid:Number(d.principalPaid||0),base});save();toast('બિલ સેવ થયું.')}}}
function billTable(list){return `<div class="tablewrap"><table><thead><tr><th>પાર્ટી / બ્રોકર</th><th>બિલ નંબર / તારીખ</th><th>નેટ રકમ</th><th>GST</th><th>કુલ બિલ</th><th>વ્યાજ આધાર</th><th>બાકી વ્યાજ</th><th>ક્રિયા</th></tr></thead><tbody>${list.map(b=>`<tr><td><b>${esc(party(b.partyId)?.name||'Unknown')}</b><br><span class="muted">${esc(party(b.partyId)?.broker||'')}</span></td><td>${esc(b.number)}<br><span class="muted">${fmtDate(b.date)}</span></td><td>${money(b.net)}</td><td>${money(b.gstAmount)}<br><span class="muted">${b.gstRate}%</span></td><td>${money(b.total)}</td><td>${(b.base==='gross'?'GST સહિત':'GST વગર')}<br><span class="muted">${b.rate}% · ${b.freeDays} દિવસ ફ્રી</span></td><td><b>${money(outstanding(b))}</b></td><td><button class="smallbtn success" onclick="collectFor('${b.id}')">રિસીવ</button><button class="smallbtn warning" onclick="waiveFor('${b.id}')">માફી</button><button class="smallbtn danger" onclick="deleteBill('${b.id}')">Delete</button></td></tr>`).join('')||`<tr><td colspan="8" class="empty">હજુ કોઈ બિલ નથી.</td></tr>`}</tbody></table></div>`}function deleteBill(id){if(confirm('બિલ અને તેની સંબંધિત એન્ટ્રીઓ ડિલીટ કરવી છે?')){db.bills=db.bills.filter(b=>b.id!==id);db.receipts=db.receipts.filter(r=>r.billId!==id);db.waivers=db.waivers.filter(w=>w.billId!==id);save()}}
function collectionPage(el){el.innerHTML=`<h2 class="sectiontitle">Interest Collection / રિસીવિંગ</h2><div class="panel">${db.bills.length?formStart('collectionForm')+`<div class="row">${select('બિલ પસંદ કરો','billId',db.bills.map(b=>[b.id,`${party(b.partyId)?.name||''} · ${b.number} · બાકી ${money(outstanding(b))}`]))}${field('રિસીવિંગ તારીખ','date','date',true,today())}${field('મળેલી વ્યાજ રકમ','amount','number',true,'','step="0.01" min="0.01"')}${select('પેમેન્ટ પ્રકાર','method',[['cash','Cash'],['bank','Bank'],['upi','UPI']])}${field('બેંક / UPI રેફરન્સ (વૈકલ્પિક)','reference','text',false)}${field('રિમાર્ક','remark','text',false)}</div><div id="collectionInfo" class="callout" style="margin-top:13px"></div><div class="actions"><button class="btn success" type="submit">રિસીવિંગ સેવ કરો</button></div></form>`:`હજુ બિલ દાખલ નથી.`}</div><section class="panel"><div class="panelhead"><h2>રિસીવિંગ હિસ્ટ્રી</h2></div><div class="tablewrap"><table><thead><tr><th>તારીખ</th><th>પાર્ટી / બિલ</th><th>રકમ</th><th>પદ્ધતિ</th><th>રેફરન્સ / રિમાર્ક</th><th>રિસીપ્ટ</th></tr></thead><tbody>${db.receipts.slice().reverse().map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${esc(party(bill(r.billId)?.partyId)?.name||'')}<br>${esc(bill(r.billId)?.number||'')}</td><td>${money(r.amount)}</td><td>${esc(r.method.toUpperCase())}</td><td>${esc(r.reference||'')} ${esc(r.remark||'')}</td><td>${esc(r.id)}</td></tr>`).join('')||`<tr><td colspan="6" class="empty">હજુ રિસીવિંગ નથી.</td></tr>`}</tbody></table></div></section>`;let f=$('#collectionForm');if(f){function info(){let b=bill(f.elements.billId.value);$('#collectionInfo').innerHTML=b?`પાર્ટી: <b>${esc(party(b.partyId)?.name)}</b> · બિલ: ${esc(b.number)} · કુલ બાકી વ્યાજ: <b>${money(outstanding(b))}</b> · આજ સુધી ગણાયેલું કુલ વ્યાજ: ${money(totalAccrued(b))}`:''}f.elements.billId.onchange=info;info();f.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f)),b=bill(d.billId);if(Number(d.amount)>outstanding(b)+0.01)return toast('મળેલી રકમ બાકી વ્યાજ કરતાં વધારે છે.');db.receipts.push({...d,id:'RC-'+uid(),amount:Number(d.amount)});save();toast('રિસીવિંગ સેવ થઈ ગઈ.')}}}function collectFor(id){navPage('collection');setTimeout(()=>{let f=$('#collectionForm');if(f){f.elements.billId.value=id;f.elements.billId.dispatchEvent(new Event('change'))}},30)}function waiveFor(id){navPage('waivers');setTimeout(()=>{let f=$('#waiverForm');if(f){f.elements.billId.value=id;f.elements.billId.dispatchEvent(new Event('change'))}},30)}
function waiversPage(el){el.innerHTML=`<h2 class="sectiontitle">Interest Waiver / Write-off</h2><div class="panel"><div class="callout"><b>નિયમ:</b> ₹500 સુધીની માફી કલેકશનવાળો માણસ કરી શકે. ₹500થી વધુ માટે માલિકની મંજૂરી જરૂરી. Full Interest Waiver અને Difference Write-off અલગ પ્રકાર છે.</div>${db.bills.length?formStart('waiverForm')+`<div class="row">${select('બિલ પસંદ કરો','billId',db.bills.map(b=>[b.id,`${party(b.partyId)?.name||''} · ${b.number} · બાકી ${money(outstanding(b))}`]))}${select('માફીનો પ્રકાર','type',[['difference','Difference Write-off (નાનો તફાવત)'],['full','Full Interest Waiver (આખું વ્યાજ માફ)']])}${field('માફ કરવાની રકમ','amount','number',true,'','step="0.01" min="0.01"')}${field('કારણ / રિમાર્ક','reason','text',true)}${field('વિનંતી કરનાર','requestedBy','text',true,'Collection Staff')}</div><div id="waiverInfo" class="callout" style="margin-top:12px"></div><div class="actions"><button class="btn warning" type="submit">માફી નોંધાવો / Approval માટે મોકલો</button></div></form>`:`પહેલાં બિલ દાખલ કરો.`}</div><section class="panel"><div class="panelhead"><h2>Waiver History & Approval</h2></div><div class="tablewrap"><table><thead><tr><th>તારીખ</th><th>પાર્ટી / બિલ</th><th>પ્રકાર</th><th>રકમ</th><th>કારણ</th><th>Status</th><th>ક્રિયા</th></tr></thead><tbody>${db.waivers.slice().reverse().map(w=>`<tr><td>${fmtDate(w.date)}</td><td>${esc(party(bill(w.billId)?.partyId)?.name||'')}<br>${esc(bill(w.billId)?.number||'')}</td><td>${w.type==='full'?'Full Waiver':'Difference Write-off'}</td><td>${money(w.amount)}</td><td>${esc(w.reason)}</td><td><span class="pill ${w.status==='approved'?'green':w.status==='pending'?'gold':'red'}">${w.status==='approved'?'Approved':w.status==='pending'?'Pending Approval':'Rejected'}</span></td><td>${w.status==='pending'?`<button class="smallbtn success" onclick="approveWaiver('${w.id}')">Approve</button><button class="smallbtn danger" onclick="rejectWaiver('${w.id}')">Reject</button>`:'—'}</td></tr>`).join('')||`<tr><td colspan="7" class="empty">હજુ કોઈ માફી એન્ટ્રી નથી.</td></tr>`}</tbody></table></div></section>`;let f=$('#waiverForm');if(f){function info(){let b=bill(f.elements.billId.value);$('#waiverInfo').textContent=b?`હાલનું બાકી વ્યાજ: ${money(outstanding(b))}. ₹500થી વધુની માફી Approval Pendingમાં જશે. ₹500 સુધીની માફી અહીં ડેમોમાં સીધી Approved થશે.`:''}f.elements.billId.onchange=info;info();f.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f)),b=bill(d.billId),amt=Number(d.amount);if(amt>outstanding(b)+.01)return toast('માફીની રકમ બાકી વ્યાજ કરતાં વધુ છે.');if(d.type==='full'&&Math.abs(amt-outstanding(b))>.02)return toast('Full Waiver માટે બાકી વ્યાજની પૂરી રકમ નાખો.');let status=amt<=500?'approved':'pending';db.waivers.push({...d,id:'WV-'+uid(),amount:amt,date:today(),status,approvedBy:status==='approved'?'Auto (≤ ₹500)':''});save();toast(status==='approved'?'₹500 સુધીની માફી સેવ થઈ.':'Approval માટે મોકલાઈ.')}}}function approveWaiver(id){let w=db.waivers.find(x=>x.id===id);if(!w||w.status!=='pending')return;let b=bill(w.billId);if(w.amount>outstanding(b)+.01)return toast('હાલનું બાકી વ્યાજ બદલાયું છે. ફરી ચકાસો.');if(confirm(`${money(w.amount)} માફી મંજૂર કરવી?`)){w.status='approved';w.approvedBy='Owner';w.approvedDate=today();save();toast('માફી મંજૂર થઈ.')}}function rejectWaiver(id){let w=db.waivers.find(x=>x.id===id);if(w&&confirm('આ માફીની વિનંતી નકારવી છે?')){w.status='rejected';w.approvedBy='Owner';save()}}
function reportsPage(el){let out=sum(db.bills,outstanding),rec=sum(db.receipts,r=>Number(r.amount)),waiv=sum(db.waivers.filter(w=>w.status==='approved'),w=>Number(w.amount));let brokers={};db.parties.forEach(p=>{brokers[p.broker]=brokers[p.broker]||{parties:0,out:0,received:0};brokers[p.broker].parties++;db.bills.filter(b=>b.partyId===p.id).forEach(b=>{brokers[p.broker].out+=outstanding(b);brokers[p.broker].received+=sum(db.receipts.filter(r=>r.billId===b.id),r=>Number(r.amount))})});el.innerHTML=`<h2 class="sectiontitle">Reports / હિસાબ</h2><div class="grid"><div class="card metric"><div class="label">બાકી વ્યાજ</div><div class="value">${money(out)}</div></div><div class="card metric"><div class="label">વસૂલ થયેલું વ્યાજ</div><div class="value">${money(rec)}</div></div><div class="card metric"><div class="label">માફ કરેલું વ્યાજ</div><div class="value">${money(waiv)}</div></div><div class="card metric"><div class="label">બિલની સંખ્યા</div><div class="value">${db.bills.length}</div></div></div><section class="panel"><div class="panelhead"><h2>પાર્ટી / બિલ પ્રમાણે Outstanding</h2>${btn('CSV ડાઉનલોડ','secondary','exportCSV()')}</div>${billTable(db.bills.filter(b=>outstanding(b)>0))}</section><section class="panel"><div class="panelhead"><h2>Broker-wise Report</h2>${btn('Broker CSV','secondary','exportBrokers()')}</div><div class="tablewrap"><table><thead><tr><th>બ્રોકર</th><th>પાર્ટીઓ</th><th>બાકી વ્યાજ</th><th>વસૂલ થયેલું વ્યાજ</th></tr></thead><tbody>${Object.entries(brokers).map(([n,v])=>`<tr><td>${esc(n)}</td><td>${v.parties}</td><td>${money(v.out)}</td><td>${money(v.received)}</td></tr>`).join('')||`<tr><td colspan="4" class="empty">ડેટા નથી.</td></tr>`}</tbody></table></div></section><section class="panel"><div class="panelhead"><h2>Monthly Collection (રિસીવિંગ તારીખ પ્રમાણે)</h2>${btn('Collection CSV','secondary','exportReceipts()')}</div><div class="tablewrap"><table><thead><tr><th>મહિનો</th><th>રિસીવિંગની સંખ્યા</th><th>વસૂલ થયેલું વ્યાજ</th></tr></thead><tbody>${monthlyRows()}</tbody></table></div><p class="muted">નોંધ: આ ડેમોમાં monthly collection રિસીવિંગ તારીખ પ્રમાણે છે. મહિનાવાર વ્યાજ accrued report માટે production versionમાં તારીખ-આધારિત transaction ledger ઉમેરવો.</p></section>`}function monthlyRows(){let m={};db.receipts.forEach(r=>{let k=(r.date||'').slice(0,7)||'Unknown';m[k]=m[k]||{n:0,v:0};m[k].n++;m[k].v+=Number(r.amount)});return Object.entries(m).sort().reverse().map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.n}</td><td>${money(v.v)}</td></tr>`).join('')||`<tr><td colspan="3" class="empty">હજુ રિસીવિંગ નથી.</td></tr>`}
function csvDownload(name,rows){let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}function exportCSV(){csvDownload('VanatKatha_Outstanding.csv',[['Party','Broker','Bill','Bill Date','Net','GST','Total','Interest Base','Outstanding Interest'],...db.bills.map(b=>[party(b.partyId)?.name,party(b.partyId)?.broker,b.number,b.date,b.net,b.gstAmount,b.total,b.base,outstanding(b).toFixed(2)])])}function exportBrokers(){let m={};db.parties.forEach(p=>{m[p.broker]=m[p.broker]||{p:0,o:0};m[p.broker].p++;db.bills.filter(b=>b.partyId===p.id).forEach(b=>m[p.broker].o+=outstanding(b))});csvDownload('VanatKatha_Brokers.csv',[['Broker','Parties','Outstanding Interest'],...Object.entries(m).map(([k,v])=>[k,v.p,v.o.toFixed(2)])])}function exportReceipts(){csvDownload('VanatKatha_Collections.csv',[['Receipt','Date','Party','Bill','Amount','Method','Reference','Remark'],...db.receipts.map(r=>[r.id,r.date,party(bill(r.billId)?.partyId)?.name,bill(r.billId)?.number,r.amount,r.method,r.reference,r.remark])])}
function backupPage(el){el.innerHTML=`<h2 class="sectiontitle">Backup & Settings</h2><div class="panel"><h2>ડેટા બેકઅપ</h2><p class="muted">આ વર્ઝનમાં ડેટા તમારા હાલના બ્રાઉઝરના Local Storageમાં છે. બ્રાઉઝરનો ડેટા સાફ થાય અથવા બીજાં ડિવાઇસમાં ખોલો તો આ ડેટા આપમેળે ત્યાં નહીં આવે. નિયમિત JSON બેકઅપ લો.</p><div class="actions">${btn('JSON Backup ડાઉનલોડ','primary','backupJSON()')}<label class="btn secondary" for="restoreFile">JSON Backup Restore</label><input id="restoreFile" class="hidden" type="file" accept="application/json" onchange="restoreJSON(event)">${btn('Demo Data ઉમેરો','secondary','seedDemo()')}${btn('બધો ડેટા કાઢી નાખો','danger','clearAll()')}</div></div><div class="panel"><h2>હાલના ડેટાની ગણતરી</h2><div class="totals"><span class="totalchip">Parties: ${db.parties.length}</span><span class="totalchip">Bills: ${db.bills.length}</span><span class="totalchip">Receipts: ${db.receipts.length}</span><span class="totalchip">Waivers: ${db.waivers.length}</span></div></div><div class="panel"><h2>વાસ્તવિક ઉપયોગ પહેલાં જરૂરી</h2><ul class="muted"><li>ક્લાઉડ ડેટાબેઝ અને દરેક યુઝર માટે સુરક્ષિત લૉગિન.</li><li>માલિક/કલેકશન/એકાઉન્ટન્ટના server-side permissions.</li><li>₹500 waiver limit અને approval server પર enforce કરવી.</li><li>બિલ/વ્યાજની ગણતરી તમારા કરાર પ્રમાણે ચકાસવી.</li><li>હાલની accounting systemમાંથી data import / integration.</li></ul></div>`}function backupJSON(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='VanatKatha_Backup_'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}function restoreJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.parties||!d.bills||!d.receipts||!d.waivers)throw 0;if(confirm('હાલનો ડેટા બદલીને આ બેકઅપ લોડ કરવો?')){db=d;save();toast('Backup restore થયું.')}}catch(_){toast('ફાઇલ યોગ્ય Vanat Katha JSON નથી.')}};r.readAsText(f)}function clearAll(){if(confirm('ખરેખર બધો ડેટા કાયમ માટે કાઢી નાખવો છે? પહેલાં બેકઅપ લેવાની ખાતરી કરો.')){db={parties:[],bills:[],receipts:[],waivers:[]};save();toast('ડેટા કાઢી નાખ્યો.')}}function seedDemo(){if(db.parties.length||!confirm('માત્ર પરીક્ષણ માટે નમૂનાના પાર્ટી અને બિલ ઉમેરવા?'))return;let p={id:uid(),name:'ABC Fabrics (Demo)',address:'Surat, Gujarat',mobile:'9876543210',gst:'',broker:'Maheshbhai (Demo)',brokerMobile:'',rate:18,freeDays:90,base:'net'};db.parties.push(p);db.bills.push({id:uid(),partyId:p.id,number:'DEMO-001',date:'2026-01-01',net:100000,gstRate:5,gstAmount:5000,total:105000,rate:18,freeDays:90,base:'net',principalPaid:0,paidDate:''});save();toast('Demo data ઉમેરાયો.')}render();
</script></body></html>
